name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      # mesh-voice links libopus/libopusfile and go-hid links libudev (CGO).
      - name: Install CGO headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libopus-dev libopusfile-dev libudev-dev
      - name: go vet and go test, every module
        run: |
          fail=0
          for mod in MANET/src/*/go.mod; do
            dir=$(dirname "$mod")
            # mesh-cli is a go.mod stub with no packages.
            ls "$dir"/*.go >/dev/null 2>&1 || continue
            echo "::group::$dir"
            (cd "$dir" && go vet ./... && go test ./...) || { echo "::error::$dir failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Runtime scripts are bash. Syntax for every shell script, shellcheck
      # errors only: warnings are not clean in the tree yet.
      - name: bash -n and shellcheck
        run: |
          fail=0
          bash_files=()
          while IFS= read -r f; do
            head -1 "$f" | grep -qE '^#!.*\b(ba)?sh' || continue
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
            head -1 "$f" | grep -q bash && bash_files+=("$f")
          done < <(git ls-files '*.sh' 'MANET/rootfs/usr/local/bin/*' \
                     'MANET/rootfs/etc/networkd-dispatcher/**' | sort -u)
          echo "checked ${#bash_files[@]} bash scripts"
          shellcheck -S error "${bash_files[@]}" || fail=1
          exit $fail

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The published BCFs the node patches (Morse firmware 1.17.9).
      - name: Fetch pinned morse-firmware
        run: |
          git init -q "$RUNNER_TEMP/morse-firmware"
          cd "$RUNNER_TEMP/morse-firmware"
          git fetch -q --depth 1 https://github.com/MorseMicro/morse-firmware.git \
            ea18605f53387281c1029ea9eb8e0de2bda7bae2
          git checkout -q FETCH_HEAD
      - name: unittest
        env:
          MORSE_FIRMWARE_DIR: ${{ runner.temp }}/morse-firmware
        run: python3 -I -B -m unittest discover -s MANET/tests -v

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: node --check web UI scripts
        run: |
          fail=0
          for f in $(git ls-files 'MANET/rootfs/**/*.js'); do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail
