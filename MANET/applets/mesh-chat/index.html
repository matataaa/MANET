<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesh Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e4e4e7;--muted:#6b7280;--accent:#3b82f6;--self:#2563eb;--other:#374151}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
#header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface)}
#header h1{font-size:15px;font-weight:600}
#header .status{font-size:12px;color:var(--muted)}
#header .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block}
#header .dot.connected{background:#22c55e}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.4;word-break:break-word}
.msg.self{align-self:flex-end;background:var(--self);border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:var(--other);border-bottom-left-radius:4px}
.msg .from{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px}
.msg.self .from{color:#93c5fd}
.msg .meta{font-size:10px;color:var(--muted);margin-top:4px}
.system{text-align:center;font-size:12px;color:var(--muted);padding:4px}
#input-bar{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface)}
#input-bar input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none}
#input-bar input:focus{border-color:var(--accent)}
#input-bar button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer}
#input-bar button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="header">
  <h1>Mesh Chat</h1>
  <span class="status"><span id="dot" class="dot"></span> <span id="conn-status">Connecting...</span></span>
</div>
<div id="messages"></div>
<div id="input-bar">
  <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off" disabled>
  <button id="send-btn" disabled>Send</button>
</div>
<script>
(function() {
  var messagesEl = document.getElementById('messages');
  var inputEl = document.getElementById('msg-input');
  var sendBtn = document.getElementById('send-btn');
  var dotEl = document.getElementById('dot');
  var statusEl = document.getElementById('conn-status');
  var ws = null;
  var myHostname = null;
  var reconnectTimer = null;

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function fmtTime(unix) {
    var d = new Date(unix * 1000);
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function addMessage(msg) {
    var isSelf = msg.from === myHostname;
    var div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other');
    div.innerHTML = '<div class="from">' + escHtml(msg.from) + '</div>' +
                    escHtml(msg.text) +
                    '<div class="meta">' + fmtTime(msg.time) + '</div>';
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function addSystem(text) {
    var div = document.createElement('div');
    div.className = 'system';
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollBottom();
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var wsUrl = proto + '//' + location.host + '/api/applets/mesh-chat/proxy/ws';
    ws = new WebSocket(wsUrl);

    ws.onopen = function() {
      dotEl.className = 'dot connected';
      statusEl.textContent = 'Connected';
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    };

    ws.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (!myHostname && msg.from) {
          fetch('/api/local').then(function(r){return r.json()}).then(function(d){
            myHostname = d.hostname || 'unknown';
          }).catch(function(){});
        }
        addMessage(msg);
      } catch(err) {}
    };

    ws.onclose = function() {
      dotEl.className = 'dot';
      statusEl.textContent = 'Disconnected';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = function() {
      ws.close();
    };
  }

  function send() {
    var text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    ws.send(text);
    inputEl.value = '';
    inputEl.focus();
  }

  sendBtn.onclick = send;
  inputEl.onkeydown = function(e) {
    if (e.key === 'Enter') send();
  };

  fetch('/api/local').then(function(r){return r.json()}).then(function(d){
    myHostname = d.hostname || 'unknown';
  }).catch(function(){});

  connect();
})();
</script>
</body>
</html>
