# Bound persistent journal growth on the SD card / eMMC. Without a cap the
# journal grows unbounded for the life of the node (see firstrun.sh.template
# for where /var/log/journal gets created so journald's default "auto"
# storage mode would pick it up).
#
# Storage=persistent is set explicitly because Raspberry Pi OS ships its own
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf forcing
# Storage=volatile (RAM-only, lost on reboot, capped separately by
# RuntimeMaxUse) on every RPi-OS-based board (CM4/Pi4/Pi5) regardless of
# whether /var/log/journal exists. Config files in this conf.d directory are
# merged across /usr/lib and /etc in filename order with later values
# winning per-directive — "manet.conf" sorts after "40-..." so this wins —
# but SystemMaxUse alone silently does nothing on those boards without also
# overriding Storage here.
[Journal]
Storage=persistent
SystemMaxUse=200M
