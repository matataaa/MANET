  <line x1="29" y1="44" x2="29" y2="60" stroke="#1a1a1e" stroke-width="1.5"/>
  <!-- Status LEDs -->
  <circle cx="14" cy="28" r="1.5" fill="#22c55e"/>
  <circle cx="20" cy="28" r="1.5" fill="#22c55e"/>
  <circle cx="26" cy="28" r="1.5" fill="#3b82f6"/>
