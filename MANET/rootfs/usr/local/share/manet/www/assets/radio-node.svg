  <line x1="10" y1="24" x2="4" y2="2" stroke="#9aa4b2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="22" x2="20" y2="0" stroke="#9aa4b2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="24" x2="36" y2="2" stroke="#9aa4b2" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Antenna bands -->
  <line x1="5.5" y1="8" x2="3.5" y2="5" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="7" x2="20" y2="4" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
