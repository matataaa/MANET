<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e4e4e7;--muted:#6b7280;--accent:#00928f;--font:-apple-system,system-ui,'Segoe UI',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 40px;text-align:center;max-width:420px;width:90%}
h1{font-size:22px;margin-bottom:6px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.info{text-align:left}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:none}
.key{color:var(--muted);font-weight:600}
.val{font-family:'SF Mono','Fira Code',monospace;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:6px;vertical-align:middle}
.dot.on{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.4)}
.dns{margin-top:16px;padding:10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--muted)}
.dns strong{color:var(--accent)}
</style>
</head>
<body>
<div class="card">
  <h1>Hello, <span>Mesh</span>!</h1>
  <div class="sub">Example applet — if you can see this, the applet system works.</div>
  <div class="info" id="info"><div class="row"><span class="key">Loading...</span><span class="val"></span></div></div>
  <div class="dns">Reachable at <strong>helloworld.mesh</strong> from any mesh node</div>
</div>
<script>
var PROXY = '/api/applets/hello-world/proxy';
function poll() {
  fetch(PROXY + '/status').then(function(r) { return r.json(); }).then(function(d) {
    var html = '';
    html += '<div class="row"><span class="key"><span class="dot on"></span>Status</span><span class="val">' + esc(d.status) + '</span></div>';
    html += '<div class="row"><span class="key">Hostname</span><span class="val">' + esc(d.hostname) + '</span></div>';
    html += '<div class="row"><span class="key">Uptime</span><span class="val">' + esc(d.uptime) + '</span></div>';
    html += '<div class="row"><span class="key">Message</span><span class="val">' + esc(d.message) + '</span></div>';
    document.getElementById('info').innerHTML = html;
  }).catch(function() {
    document.getElementById('info').innerHTML = '<div class="row"><span class="key"><span class="dot"></span>Status</span><span class="val">unreachable</span></div>';
  });
}
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
