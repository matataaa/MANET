# MANET nodes run without swap. firstrun.sh masks dev-zram0.device (zram
# hung at boot), but Raspberry Pi OS's default zram+file mechanism kept
# generating a zram0 swap that was set up and torn down every boot (failing
# with "device busy" on some) and a writeback timer that ran against no
# device until it failed. "none" generates no swap units at all and removes
# the unused /var/swap file. Read by rpi-swap-generator via
# rpi-systemd-config, which searches /usr/local/lib; the OTA tarball ships
# /usr, so updated nodes get it without re-provisioning.
[Main]
Mechanism=none
