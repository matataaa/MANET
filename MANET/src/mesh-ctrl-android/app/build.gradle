plugins {
    id 'com.android.application'
}

def gitDescribe = { prefix ->
    try {
        def proc = ["git", "describe", "--tags", "--always", "--dirty", "--match", "${prefix}-v*"].execute(null, rootDir)
        proc.waitFor()
        return proc.exitValue() == 0 ? proc.text.trim() : "dev"
    } catch (Exception e) {
        return "dev"
    }
}

def gitCommitCount = {
    try {
        def proc = ["git", "rev-list", "--count", "HEAD"].execute(null, rootDir)
        proc.waitFor()
        return proc.exitValue() == 0 ? proc.text.trim().toInteger() : 1
    } catch (Exception e) {
        return 1
    }
}

android {
    namespace 'eu.frosttechnologies.meshctrl'
    compileSdk 34

    defaultConfig {
        applicationId "eu.frosttechnologies.meshctrl"
        minSdk 26
        targetSdk 34
        versionCode gitCommitCount()
        versionName gitDescribe("android")
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
}
